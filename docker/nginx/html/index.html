<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MLOps Prediction Portal</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-slate-100 min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-slate-800 text-center">Batch Prediction</h1>

            <div class="space-y-4">
                <!-- Upload Area -->
                <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:bg-slate-50 transition">
                    <input type="file" id="csvInput" accept=".csv" class="hidden" onchange="updateFileName()" />
                    <label for="csvInput" class="cursor-pointer">
                        <div class="text-4xl mb-2">📄</div>
                        <span class="text-slate-600 font-medium">Click to upload CSV</span>
                        <p id="fileName" class="text-sm text-slate-400 mt-2">No file selected</p>
                    </label>
                </div>

                <!-- Action Button -->
                <button
                    onclick="uploadAndPredict()"
                    id="predictBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    🚀 Run Prediction
                </button>

                <!-- Status -->
                <div id="status" class="hidden p-4 rounded-lg text-sm text-center"></div>
            </div>
        </div>

        <script>
            function updateFileName() {
                const fileInput = document.getElementById("csvInput");
                const fileNameDisplay = document.getElementById("fileName");
                if (fileInput.files.length > 0) {
                    fileNameDisplay.textContent = fileInput.files[0].name;
                }
            }

            async function uploadAndPredict() {
                const fileInput = document.getElementById("csvInput");
                const btn = document.getElementById("predictBtn");
                const status = document.getElementById("status");

                if (fileInput.files.length === 0) {
                    alert("Please select a CSV file first!");
                    return;
                }

                // UI Loading State
                btn.disabled = true;
                btn.textContent = "Processing...";
                status.className = "p-4 rounded-lg text-sm text-center bg-yellow-100 text-yellow-800 block";
                status.textContent = "Uploading and processing model...";

                const formData = new FormData();
                formData.append("file", fileInput.files[0]);

                try {
                    // Call Nginx /api/ which forwards to FastAPI
                    const response = await fetch("/api/predict_batch", {
                        method: "POST",
                        body: formData,
                    });

                    if (!response.ok) throw new Error("Prediction failed");

                    // Handle CSV Download
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "predictions_result.csv";
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);

                    // Success UI
                    status.className = "p-4 rounded-lg text-sm text-center bg-green-100 text-green-800 block";
                    status.textContent = "✅ Done! Downloading results...";
                } catch (error) {
                    console.error(error);
                    status.className = "p-4 rounded-lg text-sm text-center bg-red-100 text-red-800 block";
                    status.textContent = "❌ Error: " + error.message;
                } finally {
                    btn.disabled = false;
                    btn.textContent = "🚀 Run Prediction";
                }
            }
        </script>
    </body>
</html>
